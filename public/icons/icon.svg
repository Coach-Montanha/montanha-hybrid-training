<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="256" cy="256" r="200" fill="url(#cyanAura)" />

  <g filter="url(#glow)">
    <!-- High Performance Endurance Lightning Peak -->
    <path d="M 170 320 L 256 120 L 342 320 L 290 320 L 256 220 L 222 320 Z" fill="url(#cyanGrad)" />
    <polygon points="256,120 280,210 256,210 270,280 230,200 256,200" fill="#ffffff" />
    <!-- Monogram HT -->
    <text x="256" y="300" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" letter-spacing="4">HT</text>
  </g>

  <!-- Title Badge -->
  <text x="256" y="415" text-anchor="middle" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6">MONTANHA</text>
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4">HYBRID TRAINING</text>
</svg>
